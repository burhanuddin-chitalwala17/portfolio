name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Generated SQL is up to date
        run: |
          npm run db:setup-sql
          git diff --exit-code -- supabase/ || (echo "::error::supabase/ is stale. Run npm run db:setup-sql and commit the result." && exit 1)
      # Builds without any secrets: the site falls back to its built-in content.
      - run: npm run build
